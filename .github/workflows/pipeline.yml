name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - run: npm run test
      - run: npm run build

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      
  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  discord_notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && success() }}
    steps:
      - uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: Deployment Details
          status: Success
          nodetail: true
          content: ":white_check_mark: **Deployment Successful!** A new version deployed to production"
          description: |
            **Commit:** `${{ github.event.after }}`
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** `${{ github.event.head_commit.author.name }}`

  discord_notify_failure:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'failure' }}
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: Failure Details
          status: Failure
          nodetail: true
          content: ":x: Build Failed! The pipeline encountered an error"
          description: |
            **Repository:** `${{ github.repository }}`
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.event.after }}`
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** `${{ github.event.head_commit.author.name }}`
            **Workflow:** `${{ github.workflow }}`
            **Job:** `${{ github.job }}`

            [View Commit](${{ github.event.head_commit.url }})
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
